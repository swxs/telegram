<!DOCTYPE html>
<!--
  PROTOTYPE — throwaway. Not production.
  Three variants of the Telegram Command Menu chrome, same locked four
  commands, switchable via ?variant=. Question: does this list feel right
  as the Menu UI a user would tap?
-->
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PROTOTYPE — Command Menu</title>
  <style>
    :root {
      --tg-bg: #18222d;
      --tg-chat: #0e1621;
      --tg-bar: #17212b;
      --tg-text: #f5f5f5;
      --tg-muted: #6c7b8a;
      --tg-link: #6ab2f2;
      --tg-bubble: #2b5278;
      --tg-sheet: #17212b;
      --tg-row: #1e2c3a;
      --tg-accent: #2ea6ff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0b1118;
      color: var(--tg-text);
    }
    .page {
      max-width: 420px;
      margin: 24px auto 120px;
      padding: 0 16px;
    }
    .banner {
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #c9a227;
      margin-bottom: 8px;
    }
    .question {
      font-size: 14px;
      color: var(--tg-muted);
      margin: 0 0 16px;
      line-height: 1.4;
    }
    .state {
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      background: #111a22;
      border: 1px solid #243140;
      padding: 10px 12px;
      margin-bottom: 16px;
      white-space: pre-wrap;
    }
    .phone {
      background: var(--tg-chat);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      min-height: 560px;
      display: flex;
      flex-direction: column;
    }
    .header {
      background: var(--tg-bar);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: #3d6a9a;
      display: grid;
      place-items: center;
      font-size: 14px;
      font-weight: 600;
    }
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 600;
    }
    .header p {
      margin: 0;
      font-size: 12px;
      color: var(--tg-muted);
    }
    .thread {
      flex: 1;
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      gap: 8px;
    }
    .bubble {
      align-self: flex-start;
      background: var(--tg-bar);
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 14px;
      max-width: 85%;
    }
    .bubble.me {
      align-self: flex-end;
      background: var(--tg-bubble);
    }
    .composer-wrap {
      position: relative;
      background: var(--tg-bar);
    }
    .composer {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px 12px;
    }
    .menu-btn {
      border: 0;
      background: transparent;
      color: var(--tg-accent);
      font-size: 13px;
      font-weight: 600;
      padding: 6px 8px;
      cursor: pointer;
    }
    .input {
      flex: 1;
      background: #0e1621;
      border: 0;
      border-radius: 18px;
      color: var(--tg-text);
      padding: 8px 12px;
      font-size: 14px;
    }
    .sheet, .slash, .dense {
      position: absolute;
      left: 8px;
      right: 8px;
      bottom: 52px;
      background: var(--tg-sheet);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .sheet-title {
      padding: 10px 14px 6px;
      font-size: 12px;
      color: var(--tg-muted);
      text-transform: uppercase;
    }
    button.cmd {
      display: block;
      width: 100%;
      text-align: left;
      border: 0;
      background: transparent;
      color: inherit;
      padding: 10px 14px;
      cursor: pointer;
    }
    button.cmd:hover { background: var(--tg-row); }
    .cmd-name { color: var(--tg-link); font-size: 15px; }
    .cmd-desc { color: var(--tg-muted); font-size: 13px; margin-top: 2px; }
    .dense button.cmd {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .dense .cmd-desc { margin-top: 0; text-align: right; }
    .switcher {
      position: fixed;
      left: 50%;
      bottom: 20px;
      transform: translateX(-50%);
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f4f1ea;
      color: #1a1a1a;
      border-radius: 999px;
      padding: 8px 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.35);
      z-index: 20;
      font-size: 13px;
    }
    .switcher button {
      border: 0;
      background: #1a1a1a;
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 16px;
    }
    .switcher span { min-width: 210px; text-align: center; }
  </style>
</head>
<body>
  <div class="page">
    <div class="banner">Prototype — throwaway</div>
    <p class="question">Does this Command Menu feel right as the Telegram Menu a user would tap? Copy is locked; variants only change the chrome.</p>
    <div class="state" id="state"></div>
    <div class="phone">
      <div class="header">
        <div class="avatar">DS</div>
        <div>
          <h1>DeepSeek Harness</h1>
          <p>bot</p>
        </div>
      </div>
      <div class="thread" id="thread">
        <div class="bubble">Hello! I am the DeepSeek Harness agent. Send me a message or /help for commands.</div>
      </div>
      <div class="composer-wrap">
        <div id="panel"></div>
        <div class="composer">
          <button class="menu-btn" type="button" id="menuBtn">Menu</button>
          <input class="input" id="input" value="" readonly />
        </div>
      </div>
    </div>
  </div>
  <div class="switcher">
    <button type="button" id="prev" aria-label="Previous variant">←</button>
    <span id="label"></span>
    <button type="button" id="next" aria-label="Next variant">→</button>
  </div>
  <script>
    const COMMANDS = [
      { command: "start", description: "start a session" },
      { command: "new", description: "start a fresh session" },
      { command: "clear", description: "reset the current session" },
      { command: "help", description: "show this help" },
    ];
    const VARIANTS = [
      { key: "A", name: "Menu sheet" },
      { key: "B", name: "Slash hints" },
      { key: "C", name: "Dense desktop row" },
    ];
    const params = new URLSearchParams(location.search);
    let variant = (params.get("variant") || "A").toUpperCase();
    if (!VARIANTS.some((item) => item.key === variant)) variant = "A";
    let lastTap = "(none)";

    function setVariant(next) {
      variant = next;
      const url = new URL(location.href);
      url.searchParams.set("variant", variant);
      history.replaceState(null, "", url);
      lastTap = "(none)";
      render();
    }

    function cycle(delta) {
      const index = VARIANTS.findIndex((item) => item.key === variant);
      const next = VARIANTS[(index + delta + VARIANTS.length) % VARIANTS.length];
      setVariant(next.key);
    }

    function tap(command) {
      lastTap = "/" + command;
      const thread = document.getElementById("thread");
      const bubble = document.createElement("div");
      bubble.className = "bubble me";
      bubble.textContent = "/" + command;
      thread.appendChild(bubble);
      renderState();
    }

    function rows(layout) {
      return COMMANDS.map((item) => (
        "<button class=\"cmd\" type=\"button\" data-command=\"" + item.command + "\">" +
          "<div class=\"cmd-name\">/" + item.command + "</div>" +
          "<div class=\"cmd-desc\">" + item.description + "</div>" +
        "</button>"
      )).join("");
    }

    function renderPanel() {
      const panel = document.getElementById("panel");
      const input = document.getElementById("input");
      if (variant === "A") {
        input.value = "";
        panel.innerHTML = "<div class=\"sheet\"><div class=\"sheet-title\">Menu</div>" + rows() + "</div>";
      } else if (variant === "B") {
        input.value = "/";
        panel.innerHTML = "<div class=\"slash\">" + rows() + "</div>";
      } else {
        input.value = "";
        panel.innerHTML = "<div class=\"dense\"><div class=\"sheet-title\">Commands</div>" + rows() + "</div>";
      }
      panel.querySelectorAll("[data-command]").forEach((button) => {
        button.addEventListener("click", () => tap(button.dataset.command));
      });
    }

    function renderState() {
      const current = VARIANTS.find((item) => item.key === variant);
      document.getElementById("label").textContent = current.key + " — " + current.name;
      document.getElementById("state").textContent =
        "variant: " + current.key + " (" + current.name + ")\n" +
        "commands: start, new, clear, help\n" +
        "init_in_menu: no\n" +
        "last_tap: " + lastTap;
    }

    function render() {
      renderPanel();
      renderState();
    }

    document.getElementById("prev").onclick = () => cycle(-1);
    document.getElementById("next").onclick = () => cycle(1);
    document.addEventListener("keydown", (event) => {
      const tag = document.activeElement && document.activeElement.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      if (event.key === "ArrowLeft") cycle(-1);
      if (event.key === "ArrowRight") cycle(1);
    });
    render();
  </script>
</body>
</html>
