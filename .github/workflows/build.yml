# Compile src → lib. PRs fail when committed lib is stale. Pushes to the
# default branch rebuild and commit lib so `dsh plugin add <git-url>` still
# gets a JS entry without a local DSH_CHECKOUT.
name: Build lib

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Push jobs need a branch (not a detached SHA) so rebuilt lib can be
          # committed. PR jobs check out the head so `git diff lib` matches the PR.
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.head_ref || github.ref_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install compile-time types
        run: |
          npm install --no-save --ignore-scripts \
            typescript@^5.9.0 \
            @types/node@^22.20.0 \
            @deepseek-ai/cordis@^4.0.1 \
            @deepseek-ai/schemastery@^3.18.1 \
            @deepseek-ai/dsh-agent@^0.1.0-rc.6 \
            @deepseek-ai/dsh-llm@^0.0.1-rc.1 \
            @deepseek-ai/dsh-session@^0.0.1-rc.1

      - name: Compile src → lib
        run: npx tsc -p tsconfig.json

      - name: Fail when committed lib does not match src
        if: github.event_name == 'pull_request'
        run: git diff --exit-code -- lib

      - name: Commit rebuilt lib
        if: github.event_name != 'pull_request' && github.ref_name == github.event.repository.default_branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib
          if git diff --cached --quiet; then
            echo 'lib is up to date'
            exit 0
          fi
          git commit -m 'chore: rebuild lib from src'
          git push
